<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Péndulo con botella que se vacía — rígido vs no rígido</title>
<style>
  :root { --bg:#0b1220; --panel:#111a2b; --line:#1e2a3c; --fg:#d6e2f0; --mut:#8aa0b8; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:13px system-ui,sans-serif; }
  #app { display:grid; grid-template-columns:260px 1fr 340px; height:100%; }
  #panel, #side { background:var(--panel); padding:10px; overflow-y:auto; }
  #panel { border-right:1px solid var(--line); }
  #side { border-left:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  label { display:block; margin:6px 0; color:var(--mut); }
  label span { float:right; color:var(--fg); }
  label input[type=range], label select { width:100%; }
  label.chk { color:var(--fg); }
  #stage { position:relative; min-width:0; }
  #view { width:100%; height:100%; display:block; }
  #hud { position:absolute; left:10px; top:10px; background:rgba(11,18,32,.82); padding:8px 10px;
         border:1px solid var(--line); border-radius:6px; line-height:1.45; font-variant-numeric:tabular-nums;
         max-height:calc(100% - 56px); overflow:auto; font-size:12px; max-width:280px; }
  #hud .sep { height:6px; } .tag-r { color:#ffb74d; font-weight:600; } .tag-f { color:#4dd0e1; font-weight:600; }
  #views { position:absolute; left:10px; bottom:10px; display:flex; gap:6px; flex-wrap:wrap; }
  button { background:#1b2a42; color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:5px 9px; cursor:pointer; }
  button:hover { background:#24385a; }
  canvas.ch { width:100%; height:130px; display:block; }
  textarea { width:100%; height:70px; background:#0e1624; color:var(--fg); border:1px solid var(--line); border-radius:5px; }
  .row { display:flex; gap:6px; margin-top:8px; }
  @media (max-width:900px) { #app { grid-template-columns:1fr; grid-template-rows:55vh auto auto; height:auto; } #stage { height:55vh; } }

html { -webkit-text-size-adjust: 100%; }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <b>Parámetros</b>
    <div id="sliders"></div>
    <div class="row">
      <button id="btn-reset">Reiniciar</button>
      <button id="btn-pause">Pausar</button>
      <button id="btn-csv">CSV</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="views">
      <button data-view="front">Frontal</button><button data-view="side">Lateral</button>
      <button data-view="top">Cenital</button><button data-view="bottom">Desde abajo</button>
      <button data-view="iso">Isométrica</button>
    </div>
  </div>
  <div id="side">
    <canvas class="ch" id="c-theta"></canvas>
    <canvas class="ch" id="c-h"></canvas>
    <canvas class="ch" id="c-period"></canvas>
    <canvas class="ch" id="c-amp"></canvas>
    <label>Mediciones (t, θ en grados; una por línea)</label>
    <textarea id="meas" placeholder="0.0, 25&#10;0.5, 18"></textarea>
  </div>
</div>
